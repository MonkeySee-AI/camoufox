<!doctype html>
<meta charset="utf-8">
<title>Rotunda element stream demo</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #0b1020; color: #e8ecff; font: 16px system-ui }
  header { padding: 24px 32px 8px }
  code { color: #7dd3fc }
  .stage { position: relative; height: 600px; overflow: hidden }
  .decoys { position: absolute; inset: 20px; display: grid; grid: repeat(5, 1fr) / repeat(8, 1fr); gap: 14px }
  .decoy {
    display: grid;
    place-items: center;
    border: 2px solid #ffffff30;
    border-radius: 14px;
    background: hsl(var(--hue) 65% 32%);
    color: #ffffffcc;
    font-weight: 700;
  }
  #stream-target {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 180px;
    overflow: hidden;
    padding: 24px;
    border: 4px solid #fff8;
    border-radius: 24px;
    background: linear-gradient(135deg, #ef4444, #7c3aed, #0284c7);
    background-size: 200% 200%;
    box-shadow: 0 24px 70px #0009;
    transition: width .35s ease, height .35s ease;
    animation: gradient 3s ease infinite;
  }
  #stream-target h2 { margin: 0 0 10px; font-size: 28px }
  #stream-target output { font: 700 48px ui-monospace, monospace }
  @keyframes gradient { 50% { background-position: 100% 100% } }
</style>
<header>
  <h1>DOM selector stream</h1>
  <p>Target: <code>#stream-target</code>. It resizes every 900 ms among 40 unrelated DOM elements.</p>
</header>
<main class="stage">
  <div class="decoys"></div>
  <section id="stream-target">
    <h2>Only this element</h2>
    <output></output>
  </section>
</main>
<script>
  document.querySelector(".decoys").replaceChildren(...Array.from({length: 40}, (_, index) => {
    const decoy = document.createElement("div");
    decoy.className = "decoy";
    decoy.style.setProperty("--hue", index * 37 % 360);
    decoy.textContent = `decoy ${index + 1}`;
    return decoy;
  }));
  const target = document.querySelector("#stream-target");
  const output = target.querySelector("output");
  const sizes = [[320, 180], [480, 270], [560, 315], [400, 225]];
  let frame = 0;
  setInterval(() => {
    const [width, height] = sizes[++frame % sizes.length];
    target.style.width = `${width}px`;
    target.style.height = `${height}px`;
  }, 900);
  setInterval(() => output.value = new Date().toLocaleTimeString(), 100);
</script>
